name: desktop-mac

# Checks the version number, checks and builds the interface (app/), builds
# the two macOS downloads (Apple Silicon and Intel, ad-hoc signed), tests each
# one on its own architecture, then:
#   - on main: publishes the numbered version v<desktop/package.json version>
#     (job "publish", desktop/ci/publish-release.js), only if both chips are
#     green and only if this number is not published yet;
#   - anywhere else: the same script in dry run (job "publish-dry-run"): it
#     reads, prints what it would do, and writes nothing on GitHub.
# Every run leaves its status and log tails on the ci-logs branch:
#   git fetch origin ci-logs && git show FETCH_HEAD:STATUS.md

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/**'
      - '.github/workflows/desktop-mac.yml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

# A run on main is never cancelled by a newer push (it may be publishing): the
# newer one waits. Runs on other branches share one group and replace each other.
concurrency:
  group: desktop-mac-${{ github.ref == 'refs/heads/main' && 'main' || 'branches' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash
    working-directory: desktop

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Same number in app/package.json and desktop/package.json (a.b.c), named by
      # the first section of CHANGELOG.md. Every run, before anything is built.
      - name: Version number and changelog
        id: version
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 00a-version
          node ci/publish-release.js check

      - name: Interface - install, typecheck, tests
        id: ui-check
        working-directory: app
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 00-ui-check
          sw_vers; uname -m; node --version; npm --version
          npm ci
          npm run typecheck
          npm test

      # Downloads every address of the chart collection list and reads it with the app's
      # reader. Network and forum pages are not ours: reported, not required. The test
      # itself only fails for a collection already in place; a candidate is listed in the
      # report (ci-logs branch: collections/addresses.txt and 00b-collections.log).
      - name: Interface - collection addresses (online)
        id: collections
        working-directory: app
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 00b-collections
          mkdir -p "$RUNNER_TEMP/ci-logs/collections"
          FABTICE_COLLECTIONS_ONLINE=1 \
          FABTICE_COLLECTIONS_REPORT="$RUNNER_TEMP/ci-logs/collections/addresses.txt" \
          npx vitest run src/standards/collectionAddresses.real --silent=false

      - name: Interface - build for the Mac app
        id: ui-build
        working-directory: app
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 01-ui-build
          npm run build:desktop
          ls -la ../desktop/ui ../desktop/ui/assets

      - name: Install
        id: install
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 02-install
          npm ci

      - name: Unit tests
        id: unit
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 03-unit-tests
          npm test

      - name: Build Apple Silicon app
        id: build-arm64
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 04-build-arm64
          printf '{"commit":"%s","builtAt":"%s","runId":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > build-info.json
          npm run dist:mac:arm64
          ls -la dist
          shasum -a 256 dist/Fabtice-mac-apple-silicon.dmg dist/Fabtice-mac-apple-silicon.zip

      - name: Build Intel app
        id: build-x64
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 05-build-x64
          npm run dist:mac:x64
          ls -la dist
          shasum -a 256 dist/Fabtice-mac-intel.dmg dist/Fabtice-mac-intel.zip

      - name: Unpack both apps from their zip files
        id: unpack
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 06-unpack
          mkdir -p "$RUNNER_TEMP/arm64" "$RUNNER_TEMP/x64"
          ditto -x -k dist/Fabtice-mac-apple-silicon.zip "$RUNNER_TEMP/arm64"
          ditto -x -k dist/Fabtice-mac-intel.zip "$RUNNER_TEMP/x64"
          ls "$RUNNER_TEMP/arm64" "$RUNNER_TEMP/x64"

      - name: Inspect apps
        id: inspect
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 07-inspect
          echo "######## Apple Silicon"
          ci/inspect-app.sh "$RUNNER_TEMP/arm64/Fabtice.app"
          echo "######## Intel"
          ci/inspect-app.sh "$RUNNER_TEMP/x64/Fabtice.app"

      - name: End-to-end test (stub yt-dlp, packaged app, arm64)
        id: e2e
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08-e2e-arm64
          FABTICE_E2E_APP="$RUNNER_TEMP/arm64/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-arm64" npm run test:e2e

      # The real analysis in the packaged app. It downloads the analysis tools
      # (about 18 MB) from their public location, so a network problem must not
      # block the build: the result is reported, not required.
      - name: Real analysis in the app (arm64, downloads the tools)
        id: analysis
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08b-analysis-arm64
          FABTICE_E2E_ANALYSIS=1 \
          FABTICE_E2E_APP="$RUNNER_TEMP/arm64/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-arm64" node --test test/e2e/analysis.test.js

      # The real separation in the packaged app: SCNet (13 MB) downloaded from its
      # public location, a 38 s piece separated (graphics chip if the runner offers
      # one, else the processor), the tracks shown, the report in the diagnostic
      # window. Network and speed are the runner's: reported, not required.
      - name: Real separation in the app (arm64, downloads SCNet)
        id: separation
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08c-separation-arm64
          FABTICE_E2E_SEPARATION=1 \
          FABTICE_E2E_APP="$RUNNER_TEMP/arm64/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-arm64" node --test test/e2e/separation.test.js

      # The automatic update (C16): a fake newer version, a real second packaging of the same sources with a
      # higher number (zip only), for each chip; the Intel one goes to the Intel job as an artifact.
      - name: Fake newer version for the update trial (both chips)
        id: fake-next
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08d-fake-next
          NEXT=$(node -p "const v = require('./package.json').version.split('.').map(Number); v[2] += 1; v.join('.')")
          echo "fake newer version: $NEXT"
          npx electron-builder --mac zip --arm64 --publish never -c.extraMetadata.version="$NEXT" -c.directories.output=dist-next/arm64 -c.mac.artifactName='Fabtice-mac-apple-silicon.${ext}'
          npx electron-builder --mac zip --x64 --publish never -c.extraMetadata.version="$NEXT" -c.directories.output=dist-next/x64 -c.mac.artifactName='Fabtice-mac-intel.${ext}'
          ls -la dist-next/arm64 dist-next/x64

      # The complete trial of the update (desktop/test/trial/update-trial.js): the app as built updates itself
      # to the fake newer version served locally and is relaunched on it; a tampered archive is refused; a
      # folder that cannot be written and the protected place of App Translocation are said. Required.
      - name: Update trial (arm64)
        id: update-trial
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08e-update-trial-arm64
          FABTICE_TRIAL_APP_ZIP="$PWD/dist/Fabtice-mac-apple-silicon.zip" \
          FABTICE_TRIAL_NEW_ZIP="$PWD/dist-next/arm64/Fabtice-mac-apple-silicon.zip" \
          FABTICE_TRIAL_ARCH=arm64 \
          FABTICE_TRIAL_OUT="$RUNNER_TEMP/ci-logs/trial-arm64" node test/trial/update-trial.js

      # What GitHub answers today for a release asset (the host of its redirect must be in the update's list).
      # Network: reported, not required.
      - name: GitHub release redirect host (online)
        id: release-host
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 08f-release-host
          node ci/release-host.js

      - name: yt-dlp with the app as JS runtime
        id: ytdlp
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 09-ytdlp-arm64
          ci/ytdlp-check.sh "$RUNNER_TEMP/arm64/Fabtice.app/Contents/MacOS/Fabtice" --youtube

      - name: yt-dlp EJS solver test with the app as node
        id: ejs
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 10-ejs-node-test
          ci/ejs-node-test.sh "$RUNNER_TEMP/arm64/Fabtice.app/Contents/MacOS/Fabtice"

      - uses: actions/upload-artifact@v6
        with:
          name: fabtice-mac-intel
          path: desktop/dist/Fabtice-mac-intel.zip
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v6
        with:
          name: fabtice-mac-apple-silicon
          path: desktop/dist/Fabtice-mac-apple-silicon.zip
          retention-days: 7
          compression-level: 0

      # The two downloads people open, for the publish job.
      - uses: actions/upload-artifact@v6
        with:
          name: fabtice-mac-dmg
          path: |
            desktop/dist/Fabtice-mac-apple-silicon.dmg
            desktop/dist/Fabtice-mac-intel.dmg
          retention-days: 7
          compression-level: 0

      # The fake newer Intel build, for the Intel job's update trial (never published).
      - uses: actions/upload-artifact@v6
        with:
          name: fabtice-mac-intel-next
          path: desktop/dist-next/x64/Fabtice-mac-intel.zip
          retention-days: 1
          compression-level: 0

      - name: Collect logs
        if: always()
        working-directory: .
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          printf '%s\n' "$STEPS_JSON" > "$RUNNER_TEMP/ci-logs/steps.json"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-build
          path: ${{ runner.temp }}/ci-logs
          retention-days: 7

  intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-intel
          path: ${{ runner.temp }}/app

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-intel-next
          path: ${{ runner.temp }}/next

      - name: Install test dependencies
        id: install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 12-intel-install
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string
          npm ci
          ditto -x -k "$RUNNER_TEMP/app/Fabtice-mac-intel.zip" "$RUNNER_TEMP/app"
          ls "$RUNNER_TEMP/app"

      - name: End-to-end test (stub yt-dlp, packaged app, x64)
        id: e2e
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 13-e2e-x64
          FABTICE_E2E_APP="$RUNNER_TEMP/app/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-x64" npm run test:e2e

      - name: Real analysis in the app (x64, downloads the tools)
        id: analysis
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 13b-analysis-x64
          FABTICE_E2E_ANALYSIS=1 \
          FABTICE_E2E_APP="$RUNNER_TEMP/app/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-x64" node --test test/e2e/analysis.test.js

      - name: Real separation in the app (x64, downloads SCNet)
        id: separation
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 13c-separation-x64
          FABTICE_E2E_SEPARATION=1 \
          FABTICE_E2E_APP="$RUNNER_TEMP/app/Fabtice.app/Contents/MacOS/Fabtice" \
          FABTICE_E2E_OUT="$RUNNER_TEMP/ci-logs/e2e-x64" node --test test/e2e/separation.test.js

      - name: Update trial (x64)
        id: update-trial
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 13d-update-trial-x64
          FABTICE_TRIAL_APP_ZIP="$RUNNER_TEMP/app/Fabtice-mac-intel.zip" \
          FABTICE_TRIAL_NEW_ZIP="$RUNNER_TEMP/next/Fabtice-mac-intel.zip" \
          FABTICE_TRIAL_ARCH=x64 \
          FABTICE_TRIAL_OUT="$RUNNER_TEMP/ci-logs/trial-x64" node test/trial/update-trial.js

      - name: yt-dlp with the app as JS runtime (x64)
        id: ytdlp
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 14-ytdlp-x64
          ci/ytdlp-check.sh "$RUNNER_TEMP/app/Fabtice.app/Contents/MacOS/Fabtice"

      - name: Collect logs
        if: always()
        working-directory: .
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          printf '%s\n' "$STEPS_JSON" > "$RUNNER_TEMP/ci-logs/steps-intel.json"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-intel
          path: ${{ runner.temp }}/ci-logs
          retention-days: 7

  # The numbered version, on main only, once both chips are green. The files are
  # the artifacts of the build job (the fake newer build is never among them).
  publish:
    needs: [build, intel]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-apple-silicon
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-intel
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-dmg
          path: ${{ runner.temp }}/assets

      # Already published (tag or release of this number): nothing is changed, green.
      # Otherwise: draft, five files, checked, then published (latest). See the script.
      - name: Publish the numbered version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 15-publish
          ls -la "$RUNNER_TEMP/assets"
          node ci/publish-release.js publish --assets "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/release"

      - name: Collect logs
        if: always()
        working-directory: .
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs/release"
          printf '%s\n' "$STEPS_JSON" > "$RUNNER_TEMP/ci-logs/steps-publish.json"
          cp "$RUNNER_TEMP/release/notes.md" "$RUNNER_TEMP/ci-logs/release/notes.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/release/fabtice-version.json" "$RUNNER_TEMP/ci-logs/release/fabtice-version.txt" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-publish
          path: ${{ runner.temp }}/ci-logs
          retention-days: 7

  # Everywhere but main: the same script with the same files, in dry run. It only
  # reads (git ls-remote, the list of releases) and prints the commands it would run.
  publish-dry-run:
    needs: [build, intel]
    if: success() && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-apple-silicon
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-intel
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@v7
        with:
          name: fabtice-mac-dmg
          path: ${{ runner.temp }}/assets

      - name: Publish the numbered version (dry run)
        id: publish-dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$GITHUB_WORKSPACE/desktop/ci/log-step.sh" 15-publish-dry-run
          ls -la "$RUNNER_TEMP/assets"
          node ci/publish-release.js publish --dry-run --assets "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/release"

      - name: Collect logs
        if: always()
        working-directory: .
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs/release"
          printf '%s\n' "$STEPS_JSON" > "$RUNNER_TEMP/ci-logs/steps-publish-dry-run.json"
          cp "$RUNNER_TEMP/release/notes.md" "$RUNNER_TEMP/ci-logs/release/notes.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/release/fabtice-version.json" "$RUNNER_TEMP/ci-logs/release/fabtice-version.txt" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-publish-dry-run
          path: ${{ runner.temp }}/ci-logs
          retention-days: 7

  ci-logs:
    needs: [build, intel, publish, publish-dry-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: logs-*
          path: ${{ runner.temp }}/logs

      - name: Push status and log tails to the ci-logs branch
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          out="$RUNNER_TEMP/out"
          rm -rf "$out" && mkdir -p "$out"
          {
            echo "# CI run $GITHUB_RUN_ID"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- event: $GITHUB_EVENT_NAME"
            echo "- finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- url: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '## Jobs'
            echo '```json'
            printf '%s\n' "$NEEDS_JSON"
            echo '```'
            for f in $(find logs -name 'steps*.json' | sort); do
              echo
              echo "## Steps ($f)"
              echo '```'
              jq -r 'to_entries[] | "\(.key): outcome=\(.value.outcome) conclusion=\(.value.conclusion)"' "$f" || cat "$f"
              echo '```'
            done
          } > "$out/STATUS.md"
          if [ -d logs ]; then
            find logs -type f -name '*.log' | sort | while read -r f; do
              name=$(basename "$f")
              { echo "### $f ($(wc -l < "$f") lines, last 400 shown)"; tail -n 400 "$f"; } > "$out/$name"
            done
            find logs -type f \( -name '*.txt' -o -name '*.png' \) | while read -r f; do
              dir="$out/$(basename "$(dirname "$f")")"; mkdir -p "$dir"; cp "$f" "$dir/"
            done
          fi
          cd "$out"
          git init -q -b ci-logs
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "CI logs: run $GITHUB_RUN_ID for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
          echo "pushed ci-logs"
