#cloud-config
# Fabtice extraction server: paste this into the "Cloud config" box when
# creating the VPS (Ubuntu 24.04). Replace ADMIN_TOKEN_HERE with a long random
# string and keep it private: it protects the diagnostic endpoints.
#
# The server then keeps itself up to date: every minute it fetches the main
# branch of the repository and runs server/deploy/update.sh from it.
package_update: true
packages:
  - git
  - ca-certificates
  - curl
write_files:
  - path: /etc/fabtice/admin_token
    permissions: '0644'
    content: |
      ADMIN_TOKEN_HERE
  - path: /usr/local/bin/fabtice-update
    permissions: '0755'
    content: |
      #!/bin/bash
      set -u
      REPO=https://github.com/Pelikast/Fabtice.git
      DIR=/opt/fabtice
      if [ ! -d "$DIR/.git" ]; then
        rm -rf "$DIR"
        git clone --depth 1 --branch main "$REPO" "$DIR" || exit 1
      fi
      cd "$DIR" || exit 1
      git fetch --depth 1 origin main && git reset --hard FETCH_HEAD
      exec bash "$DIR/server/deploy/update.sh"
  - path: /etc/systemd/system/fabtice-update.service
    content: |
      [Unit]
      Description=Fabtice: fetch the latest code and deploy it
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/fabtice-update
  - path: /etc/systemd/system/fabtice-update.timer
    content: |
      [Unit]
      Description=Fabtice: check for updates every minute

      [Timer]
      OnBootSec=20
      OnUnitInactiveSec=60

      [Install]
      WantedBy=timers.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now fabtice-update.timer
  - systemctl start --no-block fabtice-update.service
